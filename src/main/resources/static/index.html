<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Agenda Telefônica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .container-main {
            margin-top: 30px;
        }

        .div-telefone-linha {
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container container-main">
    <h2>Agenda Telefônica</h2>

    <form id="form_contato" class="mb-4">
        <input type="hidden" id="input_id_contato">
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="input_nome_contato" class="form-label">Nome</label>
                <input type="text" id="input_nome_contato" class="form-control" required>
            </div>
            <div class="col-md-2">
                <label for="input_idade_contato" class="form-label">Idade</label>
                <input type="number" id="input_idade_contato" class="form-control" min="0">
            </div>
        </div>

        <div id="div_telefones" class="mb-3">
            <label class="form-label">Telefones</label>
            <div class="row mb-2 div-telefone-linha">
                <div class="col-md-4">
                    <input type="text" class="form-control input-telefone" placeholder="(99) 99999-9999">
                </div>
            </div>
        </div>

        <button type="button" id="btn_adicionar_telefone" class="btn btn-secondary btn-adicionar-telefone">
            Adicionar Telefone
        </button>
        <button type="submit" id="btn_salvar" class="btn btn-primary btn-salvar">
            Salvar
        </button>
        <button type="button" id="btn_limpar" class="btn btn-warning btn-limpar">
            Limpar
        </button>
    </form>

    <div class="row mb-3">
        <div class="col-md-4">
            <input type="text" id="input_filtro_nome" class="form-control" placeholder="Filtrar por nome">
        </div>
        <div class="col-md-4">
            <input type="text" id="input_filtro_telefone" class="form-control" placeholder="Filtrar por telefone">
        </div>
        <div class="col-md-4">
            <button type="button" id="btn_pesquisar" class="btn btn-success btn-pesquisar">
                Pesquisar
            </button>
            <button type="button" id="btn_listar_todos" class="btn btn-outline-secondary btn-listar-todos">
                Listar todos
            </button>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Telefones</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody id="tbody_contatos">
        </tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
